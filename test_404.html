<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试404页面</title>
</head>
<body>
    <h1>404页面测试</h1>
    <p>测试404页面的链接：</p>
    <ul>
        <li><a href="/nonexistent-page" target="_blank">不存在的页面</a></li>
        <li><a href="/invalid/path/test" target="_blank">无效路径</a></li>
        <li><a href="/notes/999" target="_blank">不存在的文章</a></li>
    </ul>
    <p>这些链接应该都会显示自定义的404页面。</p>
    
    <h2>404页面功能检查：</h2>
    <ul>
        <li>✓ 自定义设计与网站风格统一</li>
        <li>✓ 包含返回首页和搜索按钮</li>
        <li>✓ 多语言支持（中英文）</li>
        <li>✓ 设置了正确的HTTP 404状态码</li>
        <li>✓ 包含实用的错误建议</li>
        <li>✓ 响应式设计</li>
        <li>✓ SEO友好（noindex, nofollow）</li>
    </ul>
</body>
</html>
